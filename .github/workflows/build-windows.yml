name: Compilar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Comprobar TypeScript
        run: npm run lint

      - name: Ejecutar pruebas automatizadas
        run: npm run test

      - name: Compilar ejecutable e instalador NSIS (WebView2 integrado en Windows)
        run: npm run tauri:build -- --bundles nsis

      - name: Subir instalador como artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Establecimiento-Comercial-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar instalador en GitHub Releases (al crear etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

